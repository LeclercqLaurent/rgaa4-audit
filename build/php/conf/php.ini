; Configuration PHP — environnement de DÉVELOPPEMENT.
; (En prod : display_errors=Off, opcache.validate_timestamps=0, cookie_secure=On.)

expose_php = Off
date.timezone = Europe/Paris

memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M

; Dev : on veut voir les erreurs
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[session]
session.cookie_httponly = On
session.use_strict_mode = On
; cookie_secure laissé Off en dev (HTTP local) ; à activer en prod (HTTPS).
session.cookie_secure = Off
