name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: "QA : PSR-12 et PHPStan 9"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    # composer install exécute les auto-scripts, dont cache:clear : la
    # configuration est résolue dès l'installation, passphrase comprise.
    env:
      APP_ENV: dev
      DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/rgaa?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
      JWT_PASSPHRASE: ci
      APP_SECRET: ci

    steps:
      - uses: actions/checkout@v4

      # Gate autoritaire : le hook pre-commit est local et contournable,
      # la CI est le filet qui empêche un secret d'atteindre le dépôt public.
      - name: Détection de secrets versionnés
        run: ./scripts/scan-secrets.sh --tracked
        working-directory: .

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip
          coverage: none
          tools: none

      - name: Installer les dépendances
        uses: ramsey/composer-install@v3
        with:
          working-directory: app

      - name: PHP-CS-Fixer (PSR-12, strict_types)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      # PHPStan analyse le conteneur Symfony : il lui faut le cache réchauffé.
      - name: Réchauffer le cache Symfony
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan (level 9, + règles Sonar S107 et S1142)
        run: vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --no-progress

  tests:
    name: Tests PHP et plancher de couverture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rgaa
          # Doctrine ajoute le suffixe _test en environnement de test :
          # la base visée par les tests est rgaa_test, donc le service doit
          # exposer rgaa.
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/rgaa?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      # Le vault de secrets n'est pas versionné : en CI la passphrase est une
      # variable d'environnement, qui prime sur le vault côté Symfony.
      JWT_PASSPHRASE: ci
      APP_SECRET: ci
      # Chemin de l'outil récupéré ci-dessous, en absolu depuis la racine du run.
      COMPLEXITY_COMMAND: '["php","${{ github.workspace }}/outils/phpx-complexity/bin/phpx-complexity"]'

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip
          coverage: pcov
          tools: none

      - name: Installer les dépendances
        uses: ramsey/composer-install@v3
        with:
          working-directory: app

      # Le second moteur d'audit est un outil externe. Le récupérer ici teste la
      # frontière pour de vrai, plutôt que de neutraliser les tests qui la
      # traversent.
      - name: Récupérer phpx-complexity, second moteur d'audit
        uses: actions/checkout@v4
        with:
          repository: LeclercqLaurent/phpx-complexity
          path: outils/phpx-complexity

      - name: Installer les dépendances de phpx-complexity
        uses: ramsey/composer-install@v3
        with:
          working-directory: outils/phpx-complexity

      - name: Générer la paire de clés JWT
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      # Doctrine suffixe la base par _test dans cet environnement : c'est elle
      # qu'il faut créer, pas celle que le service MariaDB provisionne au
      # démarrage. La commande la nomme à notre place.
      - name: Créer la base de test
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Construire le schéma par les migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      # Le référentiel officiel est une donnée d'entrée du domaine : si son
      # chargement casse, les tests d'audit n'ont plus de sens.
      - name: Charger le référentiel RGAA et le mapping axe-core
        run: |
          php bin/console app:referential:load
          php bin/console app:mapping:load

      - name: PHPUnit
        run: php -d pcov.enabled=1 vendor/bin/phpunit --coverage-clover var/clover.xml

      - name: Plancher de couverture (métier à 90 %)
        run: php ../scripts/couverture.php var/clover.xml 90

  spa:
    name: "SPA : typage, tests et accessibilité"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: TypeScript (--noEmit)
        run: npm run typecheck

      # Les tests montent les écrans par rôle accessible et les passent à axe :
      # une régression RGAA échoue ici, pas en recette.
      - name: Vitest (React Testing Library + axe)
        run: npm run test
