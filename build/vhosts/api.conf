<VirtualHost *:80>
    ServerName api.rgaa.local
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        # Transmet l'en-tête Authorization à PHP (JWT Bearer) — Apache ≥ 2.4.13.
        CGIPassAuth On
        # Front controller Symfony
        FallbackResource /index.php
    </Directory>

    # En-têtes de sécurité (socle ANSSI/OWASP) — la CSP stricte est gérée
    # côté application (nonce), pas ici.
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/api_error.log
    CustomLog ${APACHE_LOG_DIR}/api_access.log combined
</VirtualHost>
