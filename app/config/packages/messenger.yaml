framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Un scan multi-pages est long : on l'exécute hors requête HTTP.
            App\Application\Scan\Command\LancerScan: async
            # Génération des constats déclenchée à la fin d'un scan.
            App\Application\Audit\Command\GenererConstats: async

# En test, on exécute le scan de façon synchrone pour des scénarios déterministes
# (le PageScanner est mocké, donc aucun Node réel n'est sollicité).
when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
